<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ことばクラウド</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@500;600;700&display=swap">
<style>
  :root{
    --paper:#F7F3EA;
    --paper-2:#EFE8D8;
    --paper-3:#E4DAC0;
    --ink:#262420;
    --ink-soft:#6B6558;
    --border:#DED2B4;
    --shu:#C1391E;
    --shu-strong:#A02E17;
    --shu-soft:#F4DED4;
    --sumi-blue:#2F4E63;
    --sumi-blue-soft:#DCE6E9;
    --ok:#3E7A4E;
    --shadow: 0 10px 30px -12px rgba(38,36,32,0.35);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#1B1915;
      --paper-2:#242019;
      --paper-3:#302A20;
      --ink:#EDE6D6;
      --ink-soft:#B4AC98;
      --border:#3B362A;
      --shu:#E0663F;
      --shu-strong:#F0855F;
      --shu-soft:#3A241C;
      --sumi-blue:#8FB6CC;
      --sumi-blue-soft:#233038;
      --ok:#7BC08E;
      --shadow: 0 10px 30px -12px rgba(0,0,0,0.6);
    }
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Noto Sans JP","Zen Kaku Gothic New",sans-serif;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{
    font-family:"Zen Kaku Gothic New","Noto Sans JP",sans-serif;
    font-weight:700;
    text-wrap:balance;
    margin:0;
  }
  .mono{
    font-family:"JetBrains Mono",ui-monospace,monospace;
    font-variant-numeric:tabular-nums;
  }
  button{font-family:inherit;}
  input{font-family:inherit;}

  #app{
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:16px 20px;
    border-bottom:1px solid var(--border);
    flex-wrap:wrap;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .brand .mark{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:30px;height:30px;
    border-radius:7px;
    background:var(--shu);
    color:#fff;
    font-family:"Zen Kaku Gothic New",sans-serif;
    font-weight:900;
    font-size:15px;
    flex:none;
  }
  .brand .name{
    font-family:"Zen Kaku Gothic New",sans-serif;
    font-weight:700;
    font-size:17px;
    letter-spacing:.01em;
  }
  .topbar .room-tag{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    color:var(--ink-soft);
  }
  .topbar .room-tag .code-pill{
    font-family:"JetBrains Mono",monospace;
    font-weight:600;
    background:var(--paper-2);
    border:1px solid var(--border);
    border-radius:6px;
    padding:2px 8px;
    color:var(--ink);
    letter-spacing:.06em;
  }
  .badge-admin{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-size:11px;
    font-weight:700;
    letter-spacing:.04em;
    color:var(--shu-strong);
    background:var(--shu-soft);
    border-radius:999px;
    padding:3px 10px;
  }

  main{
    flex:1;
    width:100%;
    max-width:760px;
    margin:0 auto;
    padding:28px 20px 64px;
  }
  main.wide{max-width:980px;}

  .stack{display:flex;flex-direction:column;gap:18px;}
  .card{
    background:var(--paper-2);
    border:1px solid var(--border);
    border-radius:14px;
    padding:22px;
  }
  .card.tight{padding:16px 18px;}

  .eyebrow{
    font-size:12px;
    font-weight:700;
    letter-spacing:.08em;
    color:var(--ink-soft);
    text-transform:uppercase;
    margin:0 0 6px;
  }
  .lead{
    color:var(--ink-soft);
    font-size:14.5px;
    margin:6px 0 0;
  }

  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    border:1px solid transparent;
    border-radius:10px;
    padding:12px 18px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    transition:transform .08s ease, filter .12s ease, background .12s ease;
    white-space:nowrap;
  }
  .btn:active{transform:translateY(1px);}
  .btn:focus-visible{outline:2px solid var(--shu);outline-offset:2px;}
  .btn-primary{background:var(--shu);color:#fff;box-shadow:var(--shadow);}
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-primary:disabled{background:var(--paper-3);color:var(--ink-soft);box-shadow:none;cursor:not-allowed;}
  .btn-secondary{background:var(--paper);color:var(--ink);border-color:var(--border);}
  .btn-secondary:hover{background:var(--paper-3);}
  .btn-ghost{background:transparent;color:var(--ink-soft);border-color:transparent;padding:8px 10px;font-weight:600;font-size:13.5px;}
  .btn-ghost:hover{color:var(--ink);}
  .btn-danger{background:transparent;color:var(--shu-strong);border-color:var(--shu);}
  .btn-danger:hover{background:var(--shu-soft);}
  .btn-block{width:100%;}
  .btn-sm{padding:8px 12px;font-size:13px;border-radius:8px;}

  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:13px;font-weight:700;color:var(--ink-soft);}
  input[type=text]{
    background:var(--paper);
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 14px;
    font-size:15px;
    color:var(--ink);
    width:100%;
  }
  input[type=text]:focus{outline:2px solid var(--shu);outline-offset:1px;border-color:var(--shu);}
  input[readonly]{cursor:pointer;}

  .copy-row{
    display:flex;
    gap:8px;
    align-items:stretch;
  }
  .copy-row input{flex:1;min-width:0;letter-spacing:.03em;}

  .choice-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }
  @media (max-width:560px){.choice-grid{grid-template-columns:1fr;}}
  .choice-card{
    text-align:left;
    background:var(--paper-2);
    border:1px solid var(--border);
    border-radius:14px;
    padding:20px;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    gap:10px;
    align-items:flex-start;
    transition:border-color .12s ease, background .12s ease;
  }
  .choice-card:hover{border-color:var(--shu);}
  .choice-card .icon{
    width:38px;height:38px;
    border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    font-size:18px;
  }
  .choice-card.join .icon{background:var(--sumi-blue-soft);color:var(--sumi-blue);}
  .choice-card.create .icon{background:var(--shu-soft);color:var(--shu-strong);}
  .choice-card h3{font-size:17px;}
  .choice-card p{margin:0;color:var(--ink-soft);font-size:13.5px;}

  .admin-layout{
    display:grid;
    grid-template-columns:300px 1fr;
    gap:20px;
    align-items:start;
  }
  @media (max-width:820px){.admin-layout{grid-template-columns:1fr;}}

  .status-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .toggle{
    position:relative;
    width:46px;height:26px;
    border-radius:999px;
    background:var(--paper-3);
    border:1px solid var(--border);
    cursor:pointer;
    flex:none;
  }
  .toggle .knob{
    position:absolute;
    top:2px;left:2px;
    width:20px;height:20px;
    border-radius:50%;
    background:var(--ink-soft);
    transition:transform .15s ease, background .15s ease;
  }
  .toggle.on{background:var(--shu-soft);border-color:var(--shu);}
  .toggle.on .knob{transform:translateX(20px);background:var(--shu);}

  .slider-wrap{display:flex;flex-direction:column;gap:8px;}
  input[type=range]{
    -webkit-appearance:none;
    width:100%;
    height:6px;
    border-radius:999px;
    background:linear-gradient(90deg,var(--sumi-blue) 0%,var(--paper-3) 0%);
    outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:20px;height:20px;
    border-radius:50%;
    background:var(--shu);
    border:3px solid var(--paper);
    box-shadow:0 0 0 1px var(--border);
    cursor:pointer;
    margin-top:-7px;
  }
  input[type=range]::-moz-range-thumb{
    width:20px;height:20px;border-radius:50%;
    background:var(--shu);border:3px solid var(--paper);
    box-shadow:0 0 0 1px var(--border);cursor:pointer;
  }
  input[type=range]::-moz-range-track{height:6px;border-radius:999px;background:var(--paper-3);}
  .slider-labels{
    display:flex;justify-content:space-between;
    font-size:11.5px;color:var(--ink-soft);
  }
  .slider-readout{
    font-size:13.5px;font-weight:700;color:var(--shu-strong);
  }

  .stat-row{display:flex;gap:10px;}
  .stat{
    flex:1;
    background:var(--paper);
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px 12px;
    text-align:center;
  }
  .stat .n{font-family:"JetBrains Mono",monospace;font-size:20px;font-weight:700;}
  .stat .l{font-size:11px;color:var(--ink-soft);}

  .cloud-panel{
    background:var(--paper-2);
    border:1px solid var(--border);
    border-radius:14px;
    padding:26px;
    min-height:220px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .cloud{
    display:flex;
    flex-wrap:wrap;
    align-items:baseline;
    justify-content:center;
    gap:2px 16px;
    width:100%;
  }
  .cloud-word{
    font-family:"Zen Kaku Gothic New","Noto Sans JP",sans-serif;
    line-height:1.3;
    cursor:default;
  }
  .empty-cloud{
    text-align:center;
    color:var(--ink-soft);
    font-size:14px;
    max-width:32ch;
  }

  .word-form{display:flex;gap:8px;}
  .word-form input{flex:1;}
  .submit-note{font-size:12.5px;color:var(--ink-soft);min-height:1.2em;}
  .submit-note.ok{color:var(--ok);}

  .toast{
    position:fixed;
    left:50%;
    bottom:22px;
    transform:translateX(-50%) translateY(8px);
    background:var(--ink);
    color:var(--paper);
    padding:10px 18px;
    border-radius:999px;
    font-size:13.5px;
    font-weight:600;
    box-shadow:var(--shadow);
    opacity:0;
    pointer-events:none;
    transition:opacity .18s ease, transform .18s ease;
    z-index:50;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .error-text{color:var(--shu-strong);font-size:13.5px;min-height:1.2em;}
  .center-note{text-align:center;color:var(--ink-soft);font-size:13.5px;}

  .confirm-box{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--shu-soft);border:1px solid var(--shu);
    border-radius:10px;padding:10px 14px;font-size:13.5px;
    flex-wrap:wrap;
  }

  @media (prefers-reduced-motion:reduce){
    *{transition:none !important;animation:none !important;}
  }
</style>

<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import {
  getFirestore, doc, collection, getDoc, getDocs, setDoc, updateDoc,
  deleteDoc, addDoc, onSnapshot, query, orderBy, limit
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

var firebaseConfig = {
  apiKey: "AIzaSyDBplir85aeabIrU8EuRi8lZfuk3aY7QrM",
  authDomain: "kotoba-41904.firebaseapp.com",
  projectId: "kotoba-41904",
  storageBucket: "kotoba-41904.firebasestorage.app",
  messagingSenderId: "626422466799",
  appId: "1:626422466799:web:e27a76929cc19a1932f31a"
};

var db = null;
var firebaseInitError = null;
try {
  var firebaseApp = initializeApp(firebaseConfig);
  db = getFirestore(firebaseApp);
} catch (e) {
  firebaseInitError = e;
}

(function(){
  "use strict";

  var CODE_CHARS = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
  var TOKEN_CHARS = "ABCDEFGHJKLMNOPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789";
  var LOCAL_KEY_PREFIX = "kotobacloud_count_";
  var SUBMIT_CAP = 20;

  var app = document.getElementById("app");
  var toastEl = document.getElementById("toast");
  var toastTimer = null;

  var state = {
    view: "loading",           // loading | landing | join | participant | admin | error
    room: null,                // room code
    roomData: null,            // {title,status,threshold,adminToken,createdAt}
    isAdmin: false,
    adminToken: null,
    entries: [],
    joinError: "",
    createBusy: false,
    joinBusy: false,
    confirmingReset: false,
    resetBusy: false,
    fatalError: ""
  };
  var unsubRoom = null;
  var unsubEntries = null;

  // ---------- helpers ----------

  function randomString(len, charset){
    var out = "";
    var arr = new Uint32Array(len);
    if (window.crypto && window.crypto.getRandomValues){
      window.crypto.getRandomValues(arr);
    } else {
      for (var i=0;i<len;i++) arr[i] = Math.floor(Math.random()*4294967295);
    }
    for (var j=0;j<len;j++){
      out += charset[arr[j] % charset.length];
    }
    return out;
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function buildUrl(params){
    var base = location.origin + location.pathname;
    var qs = Object.keys(params)
      .filter(function(k){ return params[k] != null && params[k] !== ""; })
      .map(function(k){ return encodeURIComponent(k) + "=" + encodeURIComponent(params[k]); })
      .join("&");
    return qs ? (base + "?" + qs) : base;
  }

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, 1700);
  }

  function copyText(text, btnEl){
    function finish(ok){
      if (!btnEl) { if (ok) showToast("コピーしました"); return; }
      var original = btnEl.getAttribute("data-label") || btnEl.textContent;
      if (!btnEl.getAttribute("data-label")) btnEl.setAttribute("data-label", original);
      btnEl.textContent = ok ? "✓ コピーしました" : "選択してコピー";
      setTimeout(function(){
        btnEl.textContent = btnEl.getAttribute("data-label");
      }, 1600);
    }
    var p;
    try {
      if (navigator.clipboard && window.isSecureContext){
        p = navigator.clipboard.writeText(text);
      }
    } catch(e){ p = null; }

    if (p && typeof p.then === "function"){
      p.then(function(){ finish(true); }).catch(function(){ fallbackCopy(); });
    } else {
      fallbackCopy();
    }

    function fallbackCopy(){
      var ok = false;
      try {
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.setAttribute("readonly","");
        ta.style.position = "fixed";
        ta.style.top = "-1000px";
        ta.style.left = "-1000px";
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        ta.setSelectionRange(0, text.length);
        ok = document.execCommand && document.execCommand("copy");
        document.body.removeChild(ta);
      } catch(e){ ok = false; }
      finish(ok);
      if (!ok){
        // last resort: select the visible readonly field with this text, if present
        var field = document.querySelector('input[data-copy-value="'+CSS.escape(text)+'"]');
        if (field){ field.focus(); field.select(); }
      }
    }
  }

  // ---------- text normalization & clustering ----------

  function normalize(s){
    var t = String(s);
    try { t = t.normalize("NFKC"); } catch(e){}
    t = t.trim().replace(/\s+/g," ").toLowerCase();
    return t;
  }

  // Katakana -> hiragana (1:1 code-point offset for U+30A1-U+30F6), so
  // "タッセイカン" and "たっせいかん" fold to the same key without needing
  // any dictionary.
  function kataToHira(s){
    return String(s).replace(/[ァ-ヶ]/g, function(ch){
      return String.fromCharCode(ch.charCodeAt(0) - 0x60);
    });
  }

  // Kanji needs an actual reading lookup ("達成感" -> "たっせいかん") to line
  // up with its kana spellings. kuromoji.js (a Japanese morphological
  // analyzer) is loaded lazily in the background; until it's ready, or for
  // any text it can't parse, we fall back to kana-folding the literal text,
  // which already unifies hiragana/katakana variants on its own.
  var kuromojiTokenizer = null;
  var kuromojiLoading = false;
  var readingCache = new Map();

  function loadKuromoji(onReady){
    if (kuromojiTokenizer || kuromojiLoading) return;
    kuromojiLoading = true;
    var script = document.createElement("script");
    script.src = "https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/build/kuromoji.js";
    script.onload = function(){
      if (!window.kuromoji){ kuromojiLoading = false; return; }
      window.kuromoji.builder({ dicPath: "https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/dict/" }).build(function(err, tokenizer){
        kuromojiLoading = false;
        if (err || !tokenizer) return;
        kuromojiTokenizer = tokenizer;
        readingCache.clear();
        if (typeof onReady === "function") onReady();
      });
    };
    script.onerror = function(){ kuromojiLoading = false; };
    document.head.appendChild(script);
  }

  // The clustering key for one submission: kanji resolved to its reading
  // when the dictionary is loaded, otherwise just kana-folded literal text.
  // Two submissions with the very same reading always end up in one cluster
  // (similarity 1.0), regardless of where the "ゆるさ" slider sits.
  function readingKey(rawText){
    if (readingCache.has(rawText)) return readingCache.get(rawText);
    var key = kataToHira(normalize(rawText));
    if (kuromojiTokenizer){
      try {
        var tokens = kuromojiTokenizer.tokenize(rawText.trim());
        if (tokens && tokens.length){
          var readingStr = tokens.map(function(t){ return t.reading || t.surface_form || ""; }).join("");
          if (readingStr){
            key = kataToHira(normalize(readingStr));
          }
        }
      } catch(e){ /* keep the kana-folded fallback */ }
    }
    readingCache.set(rawText, key);
    return key;
  }

  function levenshtein(a, b){
    var m = a.length, n = b.length;
    if (m === 0) return n;
    if (n === 0) return m;
    var dp = new Array(n+1);
    for (var j=0;j<=n;j++) dp[j] = j;
    for (var i=1;i<=m;i++){
      var prev = dp[0];
      dp[0] = i;
      for (var k=1;k<=n;k++){
        var temp = dp[k];
        dp[k] = a[i-1] === b[k-1] ? prev : 1 + Math.min(prev, dp[k], dp[k-1]);
        prev = temp;
      }
    }
    return dp[n];
  }

  function similarity(a, b){
    var maxLen = Math.max(a.length, b.length);
    if (maxLen === 0) return 1;
    return 1 - levenshtein(a,b) / maxLen;
  }

  function thresholdFromSlider(v){
    // 0 -> 1.0 (exact match only), 100 -> 0.3 (very loose)
    return 1 - (v/100) * 0.7;
  }

  function sliderLabel(v){
    if (v <= 15) return "厳密（ほぼ同じ言葉だけをまとめる）";
    if (v <= 45) return "標準";
    if (v <= 75) return "ゆるめ";
    return "かなりゆるい（雰囲気が近い言葉もまとめる）";
  }

  function clusterEntries(entries, sliderValue){
    var counts = new Map();
    for (var i=0;i<entries.length;i++){
      var raw = (entries[i].text || "").trim();
      if (!raw) continue;
      var norm = normalize(raw);
      if (!norm) continue;
      if (!counts.has(norm)){
        counts.set(norm, { norm: norm, rKey: readingKey(raw), count: 0, variants: new Map() });
      }
      var c = counts.get(norm);
      c.count++;
      c.variants.set(raw, (c.variants.get(raw) || 0) + 1);
    }
    var uniqueWords = [];
    counts.forEach(function(v){
      var bestVariant = null, bestN = -1;
      v.variants.forEach(function(n, text){
        if (n > bestN){ bestN = n; bestVariant = text; }
      });
      uniqueWords.push({ rKey: v.rKey, count: v.count, label: bestVariant });
    });
    uniqueWords.sort(function(a,b){ return b.count - a.count; });

    var threshold = thresholdFromSlider(sliderValue);
    var clusters = [];
    for (var w=0; w<uniqueWords.length; w++){
      var word = uniqueWords[w];
      var best = null, bestSim = 0;
      for (var c2=0; c2<clusters.length; c2++){
        var sim = similarity(word.rKey, clusters[c2].rKey);
        if (sim >= threshold && sim > bestSim){ best = clusters[c2]; bestSim = sim; }
      }
      if (best){
        best.count += word.count;
        if (word.count > best.repCount){
          best.label = word.label;
          best.repCount = word.count;
          best.rKey = word.rKey;
        }
      } else {
        clusters.push({ rKey: word.rKey, label: word.label, count: word.count, repCount: word.count });
      }
    }
    clusters.sort(function(a,b){ return b.count - a.count; });
    return clusters;
  }

  // ---------- rendering: word cloud ----------

  var CLOUD_COLORS = ["var(--shu)","var(--sumi-blue)","var(--ink)","var(--shu-strong)","var(--sumi-blue)","var(--ink-soft)"];

  function renderCloud(clusters){
    if (!clusters.length){
      return '<div class="empty-cloud">まだことばが集まっていません。</div>';
    }
    var max = clusters[0].count;
    var min = clusters[clusters.length-1].count;
    var html = '<div class="cloud">';
    for (var i=0;i<clusters.length;i++){
      var c = clusters[i];
      var ratio = max === min ? 1 : (c.count - min) / (max - min);
      var size = 15 + ratio * 37; // 15px - 52px
      var weight = 500 + Math.round(ratio * 4) * 100; // 500-900
      var color = CLOUD_COLORS[i % CLOUD_COLORS.length];
      html += '<span class="cloud-word" style="font-size:'+size.toFixed(1)+'px;font-weight:'+weight+';color:'+color+'" title="'+c.count+'回">'+escapeHtml(c.label)+'</span>';
    }
    html += '</div>';
    return html;
  }

  // ---------- db access (Firebase Firestore) ----------

  function roomDocRef(code){ return doc(db, "rooms", code); }
  function entriesColRef(code){ return collection(db, "rooms", code, "entries"); }

  function subscribeRoom(code){
    unsubscribeAll();
    unsubRoom = onSnapshot(roomDocRef(code), function(snap){
      if (!snap.exists()){
        state.roomData = null;
        if (state.view === "admin" || state.view === "participant"){
          state.fatalError = "このルームは見つかりませんでした。管理者がルームを閉じた可能性があります。";
          state.view = "error";
        }
        render();
        return;
      }
      state.roomData = snap.data();
      liveUpdate();
    }, function(err){
      state.fatalError = "接続中にエラーが発生しました（" + err.code + "）。ページを再読み込みしてください。";
      state.view = "error";
      render();
    });

    var entriesQuery = query(entriesColRef(code), orderBy("createdAt","desc"), limit(500));
    unsubEntries = onSnapshot(entriesQuery, function(qs){
      var list = [];
      qs.docs.forEach(function(d){
        var data = d.data();
        if (data && typeof data.text === "string") list.push(data);
      });
      state.entries = list;
      liveUpdate();
    }, function(err){
      // non-fatal: keep whatever we have
    });
  }

  function unsubscribeAll(){
    if (unsubRoom) { unsubRoom(); unsubRoom = null; }
    if (unsubEntries) { unsubEntries(); unsubEntries = null; }
  }

  // Live snapshot updates must never blow away an input the viewer is
  // mid-typing into (their own word box, the admin's slider drag) just
  // because someone else's submission arrived. So on every live update we
  // patch only the specific DOM pieces that need it, and fall back to a
  // full render() only when the visible structure itself must change
  // (e.g. the room switches from accepting answers to closed).
  var lastParticipantMode = null;

  function computeParticipantMode(){
    var rd = state.roomData || {};
    if (rd.status === "closed") return "closed";
    if (mySubmissionCount() >= SUBMIT_CAP) return "capped";
    return "open";
  }

  function currentThreshold(){
    return (state.roomData && typeof state.roomData.threshold === "number") ? state.roomData.threshold : 40;
  }

  function liveUpdate(){
    if (state.view === "participant"){
      var mode = computeParticipantMode();
      if (mode !== lastParticipantMode){
        lastParticipantMode = mode;
        render();
        return;
      }
      updateCloudArea();
    } else if (state.view === "admin"){
      updateCloudArea();
      updateAdminStats();
      updateAdminStatusToggle();
      updateAdminSliderIfIdle();
    } else {
      render();
    }
  }

  function updateCloudArea(){
    var el = document.getElementById("cloudArea");
    if (!el){ render(); return; }
    var clusters = clusterEntries(state.entries, currentThreshold());
    el.innerHTML = renderCloud(clusters);
  }

  function updateAdminStats(){
    var clusters = clusterEntries(state.entries, currentThreshold());
    var statEls = document.querySelectorAll(".stat .n");
    if (statEls[0]) statEls[0].textContent = state.entries.length;
    if (statEls[1]) statEls[1].textContent = clusters.length;
  }

  function updateAdminStatusToggle(){
    var rd = state.roomData || {};
    var isOpen = rd.status !== "closed";
    var toggle = document.querySelector('[data-action="toggle-status"]');
    if (!toggle) return;
    toggle.classList.toggle("on", isOpen);
    toggle.setAttribute("aria-checked", isOpen ? "true" : "false");
    var row = toggle.closest(".status-row");
    var label = row ? row.querySelector("span") : null;
    if (label) label.textContent = isOpen ? "受付中" : "停止中";
  }

  function updateAdminSliderIfIdle(){
    var slider = document.getElementById("thresholdSlider");
    if (!slider || document.activeElement === slider) return;
    var threshold = currentThreshold();
    if (Number(slider.value) !== threshold){
      slider.value = threshold;
      slider.style.background = "linear-gradient(90deg,var(--sumi-blue) " + threshold + "%,var(--paper-3) " + threshold + "%)";
      var readout = document.getElementById("thresholdReadout");
      if (readout) readout.textContent = sliderLabel(threshold);
    }
  }

  // ---------- flows ----------

  function init(){
    if (firebaseInitError || !db){
      state.fatalError = "データベースへの接続に失敗しました。firebaseConfigの内容を確認してください。";
      state.view = "error";
      render();
      return;
    }
    var params = new URLSearchParams(location.search);
    var roomParam = (params.get("room") || "").trim().toUpperCase();
    var adminParam = params.get("admin");
    if (roomParam){
      openRoomFromUrl(roomParam, adminParam);
    } else {
      state.view = "landing";
      render();
    }
    // Load the Japanese reading dictionary in the background; once ready,
    // re-cluster so kanji entries line up with their kana spellings too.
    loadKuromoji(function(){ updateCloudArea(); });
  }

  function openRoomFromUrl(code, adminToken){
    getDoc(roomDocRef(code)).then(function(snap){
      if (!snap.exists()){
        state.view = "join";
        state.joinError = "コード「" + code + "」のルームが見つかりませんでした。";
        render();
        return;
      }
      var data = snap.data();
      state.room = code;
      state.roomData = data;
      if (adminToken && data.adminToken && adminToken === data.adminToken){
        state.isAdmin = true;
        state.adminToken = adminToken;
        state.view = "admin";
      } else {
        state.isAdmin = false;
        state.view = "participant";
        lastParticipantMode = null;
      }
      subscribeRoom(code);
      render();
    }).catch(function(){
      state.view = "join";
      state.joinError = "読み込みに失敗しました。もう一度お試しください。";
      render();
    });
  }

  function createRoom(title){
    state.createBusy = true;
    render();
    attemptCreate(0);

    function attemptCreate(tries){
      var code = randomString(6, CODE_CHARS);
      getDoc(roomDocRef(code)).then(function(snap){
        if (snap.exists()){
          if (tries < 5) return attemptCreate(tries+1);
          state.createBusy = false;
          state.joinError = "ルームの作成に失敗しました。もう一度お試しください。";
          state.view = "landing";
          render();
          return;
        }
        var adminToken = randomString(28, TOKEN_CHARS);
        var payload = {
          title: title && title.trim() ? title.trim().slice(0,60) : "ワードクラウド",
          status: "open",
          threshold: 40,
          adminToken: adminToken,
          createdAt: Date.now()
        };
        setDoc(roomDocRef(code), payload).then(function(){
          state.createBusy = false;
          state.room = code;
          state.roomData = payload;
          state.isAdmin = true;
          state.adminToken = adminToken;
          state.view = "admin";
          subscribeRoom(code);
          render();
        }).catch(function(){
          state.createBusy = false;
          state.joinError = "ルームの作成に失敗しました。通信環境をご確認のうえ、もう一度お試しください。";
          state.view = "landing";
          render();
        });
      }).catch(function(){
        state.createBusy = false;
        state.joinError = "ルームの作成に失敗しました。通信環境をご確認のうえ、もう一度お試しください。";
        state.view = "landing";
        render();
      });
    }
  }

  function joinRoom(rawCode){
    var code = (rawCode || "").trim().toUpperCase();
    if (!code){ state.joinError = "合言葉を入力してください。"; render(); return; }
    state.joinBusy = true;
    state.joinError = "";
    render();
    getDoc(roomDocRef(code)).then(function(snap){
      state.joinBusy = false;
      if (!snap.exists()){
        state.joinError = "そのコードのルームは見つかりませんでした。合言葉を確認してください。";
        render();
        return;
      }
      state.room = code;
      state.roomData = snap.data();
      state.isAdmin = false;
      state.view = "participant";
      lastParticipantMode = null;
      subscribeRoom(code);
      render();
    }).catch(function(){
      state.joinBusy = false;
      state.joinError = "参加に失敗しました。もう一度お試しください。";
      render();
    });
  }

  function submitWord(text){
    var word = text.trim();
    if (!word) return;
    if (word.length > 40) word = word.slice(0,40);
    addDoc(entriesColRef(state.room), { text: word, createdAt: Date.now() }).then(function(){
      var key = LOCAL_KEY_PREFIX + state.room;
      var n = parseInt(localStorage.getItem(key) || "0", 10) || 0;
      n++;
      try { localStorage.setItem(key, String(n)); } catch(e){}
      showSubmitNote("送信しました", true);
    }).catch(function(){
      showSubmitNote("送信に失敗しました。もう一度お試しください。", false);
    });
  }

  function showSubmitNote(msg, ok){
    var el = document.getElementById("submitNote");
    if (el){
      el.textContent = msg;
      el.className = "submit-note" + (ok ? " ok" : "");
    }
    setTimeout(function(){
      var el2 = document.getElementById("submitNote");
      if (el2) { el2.textContent = ""; el2.className = "submit-note"; }
    }, 2200);
  }

  function mySubmissionCount(){
    if (!state.room) return 0;
    try { return parseInt(localStorage.getItem(LOCAL_KEY_PREFIX + state.room) || "0", 10) || 0; }
    catch(e){ return 0; }
  }

  function toggleStatus(){
    if (!state.isAdmin || !state.roomData) return;
    var next = state.roomData.status === "open" ? "closed" : "open";
    updateDoc(roomDocRef(state.room), { status: next }).catch(function(){
      showToast("更新に失敗しました");
    });
  }

  var thresholdDebounce = null;
  function setThreshold(v){
    if (state.roomData) state.roomData.threshold = v; // optimistic, local render only
    renderAdminSliderOnly(v);
    if (thresholdDebounce) clearTimeout(thresholdDebounce);
    thresholdDebounce = setTimeout(function(){
      updateDoc(roomDocRef(state.room), { threshold: v }).catch(function(){
        showToast("更新に失敗しました");
      });
    }, 250);
  }

  function renderAdminSliderOnly(v){
    var readout = document.getElementById("thresholdReadout");
    if (readout) readout.textContent = sliderLabel(v);
    var track = document.getElementById("thresholdSlider");
    if (track) track.style.background = "linear-gradient(90deg,var(--sumi-blue) " + v + "%,var(--paper-3) " + v + "%)";
    // also re-render the cloud live so admin sees the effect immediately
    var cloudEl = document.getElementById("cloudArea");
    if (cloudEl){
      var clusters = clusterEntries(state.entries, v);
      cloudEl.innerHTML = renderCloud(clusters);
    }
  }

  function doReset(){
    state.resetBusy = true;
    state.confirmingReset = false;
    render();
    getDocs(entriesColRef(state.room)).then(function(qs){
      var dels = qs.docs.map(function(d){ return deleteDoc(doc(entriesColRef(state.room), d.id)); });
      return Promise.all(dels);
    }).then(function(){
      state.resetBusy = false;
      showToast("すべての回答をリセットしました");
      render();
    }).catch(function(){
      state.resetBusy = false;
      showToast("リセットに失敗しました");
      render();
    });
  }

  function leaveRoom(){
    unsubscribeAll();
    state.room = null;
    state.roomData = null;
    state.isAdmin = false;
    state.adminToken = null;
    state.entries = [];
    state.joinError = "";
    state.view = "landing";
    lastParticipantMode = null;
    render();
  }

  // ---------- views ----------

  function topbarHtml(){
    var right = "";
    if (state.room && state.roomData){
      right = '<div class="room-tag">' +
        (state.isAdmin ? '<span class="badge-admin">管理者</span>' : '') +
        '<span>' + escapeHtml(state.roomData.title || "") + '</span>' +
        '<span class="code-pill">' + escapeHtml(state.room) + '</span>' +
        (state.view === "participant" ? '<button class="btn-ghost" data-action="leave-room">退出</button>' : '') +
        '</div>';
    }
    return '<div class="topbar">' +
      '<div class="brand"><span class="mark">こ</span><span class="name">ことばクラウド</span></div>' +
      right +
      '</div>';
  }

    return topbarHtml() + '<main><div class="center-note" style="padding-top:80px;">読み込み中…</div></main>';

    return topbarHtml() + '<main><div class="stack">' +
      '<button class="btn-ghost" data-action="go-landing">← 戻る</button>' +
      '<div class="card stack">' +
        '<div><h2>ルームを作成</h2><p class="lead">タイトルは参加者にも表示されます（あとから変更はできません）。</p></div>' +
        '<form data-form="create-room" class="stack" style="gap:14px;">' +
          '<div class="field">' +
            '<label for="roomTitle">タイトル（任意）</label>' +

          '</div>' +
          '<button type="submit" class="btn btn-primary btn-block" ' + (state.createBusy ? 'disabled' : '') + '>' +

          '</button>' +
        '</form>' +
      '</div>' +
      '</div></main>';

  function viewJoin(){
    return topbarHtml() + '<main><div class="stack">' +
      '<button class="btn-ghost" data-action="go-landing">← 戻る</button>' +
      '<div class="card stack">' +
        '<div><h2>参加する</h2><p class="lead">管理者からもらった合言葉（6文字）を入力してください。</p></div>' +
        (state.joinError ? '<div class="error-text">' + escapeHtml(state.joinError) + '</div>' : '') +
        '<form data-form="join-room" class="stack" style="gap:14px;">' +
          '<div class="field">' +
            '<label for="joinCode">合言葉</label>' +
            '<input type="text" id="joinCode" name="code" placeholder="例：K7QX2M" maxlength="6" autocomplete="off" style="text-transform:uppercase;letter-spacing:.12em;font-family:\'JetBrains Mono\',monospace;font-weight:600;">' +
          '</div>' +
          '<button type="submit" class="btn btn-primary btn-block" ' + (state.joinBusy ? 'disabled' : '') + '>' +
            (state.joinBusy ? '確認中…' : '参加する') +
          '</button>' +
        '</form>' +
      '</div>' +
      '</div></main>';
  }

  function viewParticipant(){
    var rd = state.roomData || {};
    var clusters = clusterEntries(state.entries, typeof rd.threshold === "number" ? rd.threshold : 40);
    var closed = rd.status === "closed";
    var mine = mySubmissionCount();
    var capped = mine >= SUBMIT_CAP;

    var inputBlock;
    if (closed){
      inputBlock = '<div class="card"><p class="lead" style="margin:0;">現在、このルームは回答の受付を終了しています。下に結果が表示されます。</p></div>';
    } else if (capped){
      inputBlock = '<div class="card"><p class="lead" style="margin:0;">たくさん送ってくれてありがとうございます！このルームへの送信はここまでにしましょう。</p></div>';
    } else {
      inputBlock = '<div class="card stack">' +
        '<div class="field">' +
          '<label for="wordInput">今のことばを一言で</label>' +
          '<form data-form="submit-word" class="word-form">' +
            '<input type="text" id="wordInput" name="word" placeholder="例：達成感" maxlength="40" autocomplete="off" autofocus>' +
            '<button type="submit" class="btn btn-primary">送信</button>' +
          '</form>' +
        '</div>' +
        '<div class="submit-note" id="submitNote"></div>' +
        '</div>';
    }

    return topbarHtml() + '<main><div class="stack">' +
      '<div>' +
        '<h1 style="font-size:22px;">' + escapeHtml(rd.title || "ワードクラウド") + '</h1>' +
        '<p class="lead">思いついたことばを送ると、みんなの回答と一緒にクラウドに反映されます。</p>' +
      '</div>' +
      inputBlock +
      '<div class="cloud-panel"><div id="cloudArea">' + renderCloud(clusters) + '</div></div>' +
      '</div></main>';
  }

  function viewAdmin(){

    var threshold = typeof rd.threshold === "number" ? rd.threshold : 40;
    var clusters = clusterEntries(state.entries, threshold);
    var joinUrl = buildUrl({ room: state.room });
    var adminUrl = buildUrl({ room: state.room, admin: state.adminToken });
    var isOpen = rd.status !== "closed";

    var sidebar = '<div class="stack">' +
      '<div class="card stack">' +
        '<div class="eyebrow">共有</div>' +
        '<div class="field">' +
          '<label>合言葉</label>' +
          '<div class="copy-row">' +
            '<input type="text" readonly value="' + escapeHtml(state.room) + '" data-copy-value="' + escapeHtml(state.room) + '" class="mono" style="font-weight:700;letter-spacing:.12em;">' +
            '<button class="btn btn-secondary btn-sm" data-action="copy" data-copy="' + escapeHtml(state.room) + '">コピー</button>' +
          '</div>' +

          '<label>参加用URL</label>' +
          '<div class="copy-row">' +

    return topbarHtml() + '<main class="wide"><div class="admin-layout">' + sidebar + cloud + '</div></main>';
  }

  function render(){
    var html;
    switch(state.view){
      case "landing": html = viewLanding(); break;
      case "create": html = viewCreate(); break;
      case "join": html = viewJoin(); break;
      case "participant": html = viewParticipant(); break;
      case "admin": html = viewAdmin(); break;
      case "error": html = viewError(); break;
      default: html = viewLoading();
    }
    app.innerHTML = html;
  }

  // ---------- event delegation ----------

  app.addEventListener("click", function(e){
    var actionEl = e.target.closest("[data-action]");
    if (!actionEl) return;
    var action = actionEl.getAttribute("data-action");
    switch(action){
      case "go-landing":
        state.joinError = "";
        state.view = "landing";
        render();
        break;
      case "show-create":
        state.joinError = "";
        state.view = "create";
        render();
        break;
      case "show-join":
        state.joinError = "";
        state.view = "join";
        render();
        break;
      case "copy":
        copyText(actionEl.getAttribute("data-copy") || "", actionEl);
        break;
      case "toggle-status":
        toggleStatus();
        break;
      case "ask-reset":
        state.confirmingReset = true;
        render();
        break;
      case "cancel-reset":
        state.confirmingReset = false;
        render();
        break;
      case "confirm-reset":
        doReset();
        break;
      case "leave-room":
        leaveRoom();
        break;
    }
  });

  app.addEventListener("keydown", function(e){
    var t = e.target.closest('[data-action="toggle-status"]');
    if (t && (e.key === "Enter" || e.key === " ")){
      e.preventDefault();
      toggleStatus();
    }
  });

  app.addEventListener("submit", function(e){
    var form = e.target.closest("[data-form]");
    if (!form) return;
    e.preventDefault();
    var type = form.getAttribute("data-form");
    if (type === "create-room"){
      var title = form.querySelector('[name="title"]').value;
      createRoom(title);
    } else if (type === "join-room"){
      var code = form.querySelector('[name="code"]').value;
      joinRoom(code);
    } else if (type === "submit-word"){
      var input = form.querySelector('[name="word"]');
      var val = input.value;
      submitWord(val);
      input.value = "";
      input.focus();
    }
  });

  app.addEventListener("input", function(e){
    if (e.target.matches('[data-input="threshold"]')){
      var v = parseInt(e.target.value, 10) || 0;
      setThreshold(v);
    }
  });

  app.addEventListener("focusin", function(e){
    if (e.target.matches("input[readonly]")){
      e.target.select();
    }
  });

  render();
  init();
})();
</script>
</body>
</html>
